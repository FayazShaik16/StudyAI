services:
  - type: web
    name: studyai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()'
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_UPLOAD_SIZE
        value: 52428800
      - key: AI_MAX_RETRIES
        value: 2
      - key: SUMMARY_TIMEOUT
        value: 60
